# Fully-pinned dependency lock for sdvx-b50-image-bot.
# Target interpretation: CPython 3.12+ (numpy==2.5.2 requires >=3.12).
# Regenerate like a pip freeze so every direct AND transitive package is
# pinned to an exact == version (no >= or ~=), e.g.:
#     python -m pip install -r requirements.txt
#     python -m pip freeze > requirements.lock

# NOTE (offline gap): this lock was generated offline without network in the
# generation environment, so it could NOT be produced by an actual `pip freeze`
