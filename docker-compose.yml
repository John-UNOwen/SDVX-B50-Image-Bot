# docker-compose up -d --build
# Put DISCORD_TOKEN in a .env file next to this file, or in the environment.
services:
  b50-bot:
    build: .
    container_name: sdvx-b50-image-bot
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - LINKS_DB=/app/data/links.db
      - STATS_DB=/app/data/stats.db
    volumes:
      - b50-jacket-cache:/app/b50_render/.jacket_cache
      - b50-data:/app/data

volumes:
  b50-jacket-cache:
  b50-data:
